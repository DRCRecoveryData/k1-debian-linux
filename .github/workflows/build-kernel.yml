name: Build MIPS Kernel

on:
  push:
    branches:
      - anti-freezes-method
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: ivan-habl/k1-debian-linux
        ref: anti-freezes-method

    - name: Set up Toolchain Path
      run: |
        echo "TOOLCHAIN_DIR=${{ github.workspace }}/mips-toolchain" >> $GITHUB_ENV
        echo "TOOLCHAIN_PATH=${{ github.workspace }}/mips-toolchain/mips32r5el--glibc--bleeding-edge-2025.08-1" >> $GITHUB_ENV

    - name: Cache MIPS Toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: ${{ env.TOOLCHAIN_DIR }}
        key: ${{ runner.os }}-mips-toolchain-2025.08-1

    - name: Download and Extract MIPS Toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${{ env.TOOLCHAIN_DIR }}
        cd ${{ env.TOOLCHAIN_DIR }}
        wget https://toolchains.bootlin.com/downloads/releases/toolchains/mips32r5el/tarballs/mips32r5el--glibc--bleeding-edge-2025.08-1.tar.xz
        tar -xJf mips32r5el--glibc--bleeding-edge-2025.08-1.tar.xz

    - name: Set up Environment
      run: |
        echo "PATH=${{ env.TOOLCHAIN_PATH }}/bin:$PATH" >> $GITHUB_ENV
        echo "CROSS_COMPILE=mipsel-linux-" >> $GITHUB_ENV
        echo "ARCH=mips" >> $GITHUB_ENV

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bc rsync u-boot-tools

    - name: Cache Kernel Build
      id: cache-kernel
      uses: actions/cache@v4
      with:
        path: |
          .
          !./mips-toolchain
        key: ${{ runner.os }}-kernel-build-${{ hashFiles('.config') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-kernel-build-${{ hashFiles('.config') }}-

    - name: Build Kernel (uImage)
      run: |
        make -j$(nproc) uImage

    - name: Build Modules
      run: |
        make -j$(nproc) modules
        mkdir -p ${{ github.workspace }}/modules_install
        make INSTALL_MOD_PATH=${{ github.workspace }}/modules_install modules_install

    - name: Archive Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-uImage
        path: arch/mips/boot/uImage

    - name: Archive Kernel Modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-modules
        path: ${{ github.workspace }}/modules_install/lib/modules/
