name: Build MIPS Kernel

on:
  push:
    branches:
      - anti-freezes-method
      - blanking-fix
  workflow_dispatch:

env:
  TOOLCHAIN_URL: "https://toolchains.bootlin.com/downloads/releases/toolchains/mips32r5el/tarballs/mips32r5el--glibc--bleeding-edge-2025.08-1.tar.xz"
  TOOLCHAIN_TARBALL: "mips32r5el--glibc--bleeding-edge-2025.08-1.tar.xz"
  TOOLCHAIN_DIR_NAME: "mips32r5el--glibc--bleeding-edge-2025.08-1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bc rsync u-boot-tools ccache curl

    - name: Download Toolchain and Generate SHA
      id: download_toolchain
      run: |
        curl -fSL -o "${{ env.TOOLCHAIN_TARBALL }}" "${{ env.TOOLCHAIN_URL }}"
        echo "sha=$(sha256sum ${{ env.TOOLCHAIN_TARBALL }} | cut -d' ' -f1)" >> $GITHUB_OUTPUT

    - name: Cache and Extract MIPS Toolchain
      id: cache_toolchain
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/mips-toolchain
        key: ${{ runner.os }}-toolchain-${{ steps.download_toolchain.outputs.sha }}

    - name: Extract Toolchain if not restored from cache
      if: steps.cache_toolchain.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${{ github.workspace }}/mips-toolchain
        tar -xJf "${{ env.TOOLCHAIN_TARBALL }}" -C ${{ github.workspace }}/mips-toolchain
    
    - name: Set up Environment Variables
      run: |
        TOOLCHAIN_PATH="${{ github.workspace }}/mips-toolchain/${{ env.TOOLCHAIN_DIR_NAME }}"
        echo "TOOLCHAIN_PATH=$TOOLCHAIN_PATH" >> $GITHUB_ENV
        echo "$TOOLCHAIN_PATH/bin" >> $GITHUB_PATH
        echo "CROSS_COMPILE=mipsel-linux-" >> $GITHUB_ENV
        echo "ARCH=mips" >> $GITHUB_ENV

    - name: Get Compiler Version
      id: compiler_version
      run: echo "ver=$(mipsel-linux-gcc --version | head -n1)" >> $GITHUB_OUTPUT

    - name: Set up ccache using specialized action
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ runner.os }}-${{ steps.compiler_version.outputs.ver }}-v2
        restore-keys: |
          ccache-${{ runner.os }}-${{ steps.compiler_version.outputs.ver }}-

    - name: Build Kernel and Modules
      run: |
        echo "--- ccache stats before build ---"
        ccache -z
        ccache -s
        make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} CC="ccache ${{ env.CROSS_COMPILE }}gcc" -j$(nproc) all uImage
        echo "--- ccache stats after build ---"
        ccache -s

    - name: Prepare Modules for Artifact
      run: make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} INSTALL_MOD_PATH=${{ github.workspace }}/modules_install modules_install

    - name: Archive Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-uImage
        path: arch/mips/boot/uImage

    - name: Archive Kernel Modules
      run: |
        cd ${{ github.workspace }}/modules_install/lib/modules
        if [ -n "$(ls -A .)" ]; then
          tar -czf ${{ github.workspace }}/modules.tar.gz *
        fi

    - name: Upload Kernel Modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-modules
        path: ${{ github.workspace }}/modules.tar.gz
        if-no-files-found: error
